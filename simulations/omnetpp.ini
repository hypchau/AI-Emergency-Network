# =============================================================================
#  AI Emergency Network - Bhotekoshi flash flood, Rasuwa (Nepal), 26 Aug 2026
# =============================================================================
#
#  Configurations
#    QuickFlat   : runs right away, no download (flat ground, no map) - for checks
#    Rasuwa2D    : real relief + OpenStreetMap background on the 2D canvas
#    Rasuwa3D    : real relief on the osgEarth 3D globe (needs osgEarth, see README)
#    Failure2D   : Rasuwa2D + a drone failure at t = 30 min
#    FleetSweep  : batch study, 1..20 drones x 3 seeds (Cmdenv), for the KPI curves
#
#  Before Rasuwa2D/Rasuwa3D/Failure2D/FleetSweep:  python ../tools/fetch_terrain.py
#  (downloads the real elevation and the map of the area, once)
#
#  Main knobs:  *.numDrones (1..20, later chosen by the AI)
#               **.drone[*].battery.flightPower (endurance hypothesis)
#               **.hive.accessRange / meshRange (radio hypotheses)
# =============================================================================

[General]
network = aien.simulations.EmergencyNetwork
image-path = "../images"
sim-time-limit = 7200s                    # 2 hours of operations
**.vector-recording = true
**.scalar-recording = true
*.visualizer.**.vector-recording = false
**.wlan[*].**.vector-recording = false
**.aodv.**.vector-recording = false

# ------------------------------------------------------------------ scenario --
*.numDrones = 10
*.numUsers = 50

# scene origin = north-west corner of the area (12.7 km x 23.4 km)
*.coordinateSystem.sceneLatitude = 28.30deg
*.coordinateSystem.sceneLongitude = 85.27deg

# the hive truck: Syabrubesi roadhead, end of the H12 road from Dhunche
# (approximate coordinates; Syabrubesi was hit by the flood)
*.hiveLatitude = 28.1625deg
*.hiveLongitude = 85.3420deg

# phones of victims and rescuers, grouped around the settlements hit by the
# flood (approximate coordinates: Wikipedia / GeoNames; mid-valley = estimate)
#   Syabrubesi (12 phones)
*.user[0..11].mobility.latitude = 28.1625deg
*.user[0..11].mobility.longitude = 85.3420deg
*.user[0..11].mobility.scatterRadius = 500m
#   mid-valley between Syabrubesi and Timure (10 phones, estimate)
*.user[12..21].mobility.latitude = 28.2070deg
*.user[12..21].mobility.longitude = 85.3550deg
*.user[12..21].mobility.scatterRadius = 600m
#   Timure, the most damaged town (14 phones)
*.user[22..35].mobility.latitude = 28.2537deg
*.user[22..35].mobility.longitude = 85.3665deg
*.user[22..35].mobility.scatterRadius = 400m
#   Rasuwagadhi border crossing and customs (6 phones)
*.user[36..41].mobility.latitude = 28.2778deg
*.user[36..41].mobility.longitude = 85.3778deg
*.user[36..41].mobility.scatterRadius = 300m
#   Dhunche, district headquarters (8 phones)
*.user[42..49].mobility.latitude = 28.1117deg
*.user[42..49].mobility.longitude = 85.2978deg
*.user[42..49].mobility.scatterRadius = 400m

# ------------------------------------------------------- drone (DJI M400) ----
**.drone[*].mobility.flightHeight = 100m
**.drone[*].mobility.cruiseSpeed = 18mps
**.drone[*].battery.capacity = 977Wh       # TB100
**.drone[*].battery.flightPower = 1990W    # -> 27 min with the 180 W base station (estimate)
**.drone[*].battery.payloadPower = 180W

# ------------------------------------------------------------- hive / AI ----
**.hive.accessRange = 2000m
**.hive.meshRange = 5000m
**.hive.motherRange = 2500m
**.hive.motherHeight = 100m
**.hive.reserveRatio = 0.2
**.hive.batterySwapTime = 300s
**.hive.fullChargeTime = 2700s
**.hive.launchInterval = 20s

# --------------------------------------------- radio (simple, unit disk) -----
# One interface per node (AODV is single-interface). The custom analog model
# makes links with a phone 2 km long in both directions (4G access cell) and
# drone/hive links 5 km long (mesh), and blocks links hidden by the relief.
# Coverage KPIs come from the hive controller (same ranges, same DEM); the
# packet-level SOS traffic below checks that the relays really forward it.
*.radioMedium.analogModel.typename = "TerrainUnitDiskAnalogModel"
*.radioMedium.analogModel.phoneRange = 2000m
*.radioMedium.rangeFilter = "interferenceRange"
*.radioMedium.radioModeFilter = true
**.wlan[*].typename = "WirelessInterface"
**.wlan[*].radio.typename = "UnitDiskRadio"
**.wlan[*].mac.typename = "CsmaCaMac"
**.wlan[*].queue.typename = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 100
**.wlan[*].mac.bitrate = 54Mbps
# 5 km links: the ACK round trip (2 x 17 us of propagation) exceeds the default
# 20 us slot, which made the MAC retransmit and duplicate every frame. A longer
# slot (like 802.11 "coverage class") fixes the ACK timeout.
**.wlan[*].mac.slotTime = 40us
**.wlan[*].radio.transmitter.bitrate = 54Mbps
**.wlan[*].radio.transmitter.communicationRange = 5000m
**.ipv4.arp.typename = "GlobalArp"
*.configurator.addStaticRoutes = false

# ---------------------------------------------------------- SOS traffic ------
**.user[*].numApps = 1
**.user[*].app[0].typename = "UdpBasicApp"
**.user[*].app[0].destAddresses = "truck"
**.user[*].app[0].destPort = 5000
**.user[*].app[0].messageLength = 200B
**.user[*].app[0].sendInterval = exponential(10s)
**.user[*].app[0].startTime = uniform(60s, 120s)
**.user[*].app[0].packetName = "SOS"
**.truck.numApps = 1
**.truck.app[0].typename = "UdpSink"
**.truck.app[0].localPort = 5000

# ------------------------------------------------------------ visuals --------
# 2D canvas only by default (the 3D part is switched on in Rasuwa3D)
*.visualizer.osgVisualizer.typename = ""
*.visualizer.*.mobilityVisualizer.moduleFilter = "**.drone[*].mobility"
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.mobilityVisualizer.trailLength = 200
*.visualizer.*.infoVisualizer.modules = "*.drone[*].battery or *.truck.hive"
*.visualizer.*.infoVisualizer.format = "%t"
*.visualizer.*.dataLinkVisualizer.displayLinks = true
*.visualizer.*.dataLinkVisualizer.packetFilter = "SOS*"
*.visualizer.*.dataLinkVisualizer.fadeOutTime = 3s
*.visualizer.*.dataLinkVisualizer.lineColor = "#1E6EC8"

[Config QuickFlat]
description = "Runs without any download: flat ground, no map (checks, Cmdenv)"
**.terrain.demFile = ""
**.terrain.flatElevation = 1500m

[Config Rasuwa2D]
description = "Real relief (DEM) + OpenStreetMap background, 2D canvas"
**.terrain.demFile = "terrain/rasuwa_dem.asc"
**.terrain.mapImage = "maps/rasuwa"

[Config Rasuwa3D]
description = "Real relief on the osgEarth 3D globe (needs OMNeT++ built with osgEarth)"
extends = Rasuwa2D
*.coordinateSystem.typename = "OsgGeographicCoordinateSystem"
*.visualizer.osgVisualizer.typename = "IntegratedOsgVisualizer"
*.visualizer.osgVisualizer.sceneVisualizer.typename = "SceneOsgEarthVisualizer"
*.visualizer.osgVisualizer.sceneVisualizer.mapFile = "rasuwa.earth"
*.visualizer.osgVisualizer.sceneVisualizer.displayScene = false
*.visualizer.osgVisualizer.sceneVisualizer.cameraDistanceFactor = 1.2

[Config Failure2D]
description = "Rasuwa2D + one drone on post fails at t = 30 min"
extends = Rasuwa2D
**.hive.failureTime = 1800s

[Config FleetSweep]
description = "Batch: 1..20 drones x 3 seeds, results in results/ (use Cmdenv)"
extends = Rasuwa2D
*.numDrones = ${N=1..20}
repeat = 3
**.terrain.mapImage = ""
**.vector-recording = false
